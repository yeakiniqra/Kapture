name: Windows build

# Builds the portable Windows executable. Runs the headless self-test on
# Windows first, so a platform regression fails the build rather than the user.
# On a version tag the .exe is attached to that tag's GitHub release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Self-test (offscreen Qt)
        run: python scripts/selftest.py

      - name: Build executable
        run: pyinstaller kapture.spec

      - name: Name by version
        shell: pwsh
        run: |
          $v = (Select-String -Path kapture/__init__.py -Pattern 'VERSION\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          Move-Item dist/kapture.exe "dist/Kapture-$v-windows-x64.exe"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: Kapture-windows-x64
          path: dist/*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" (Get-ChildItem dist/*.exe).FullName --clobber
